[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools >= 77", "wheel"]

[project]
dependencies = [
    "mcp[cli]>=1.2.0",
    "httpx>=0.28.0",
]
name = "datatagger-mcp"
description = "An MCP server for TUM DataTagger (local/stdio mode)"
readme = "README.md"
requires-python = ">=3.10"
version = "0.1.0"

[project.scripts]
datatagger-mcp = "datatagger_mcp.__main__:main"
